name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: System tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check src tests
      - name: Test
        run: pytest -q

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Build sdist and wheel
        run: uv build
      - name: Check metadata
        run: uvx twine check --strict dist/*
      - name: Install the wheel and run it
        run: |
          uv venv /tmp/wheel-env
          uv pip install -p /tmp/wheel-env/bin/python dist/*.whl
          /tmp/wheel-env/bin/assara --version
          /tmp/wheel-env/bin/assara init /tmp/lib
          /tmp/wheel-env/bin/assara --library /tmp/lib status

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t assara:ci .
      - name: Smoke test
        run: |
          docker run --rm assara:ci --version
          mkdir -p lib && chmod 777 lib
          docker run --rm -v "$PWD/lib:/library" assara:ci init /library
          docker run --rm -v "$PWD/lib:/library" assara:ci status
